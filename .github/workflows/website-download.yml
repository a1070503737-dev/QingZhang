name: Maintain QingZhang latest APK download

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qingzhang-website-download
  cancel-in-progress: false

jobs:
  add-download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Verify and attach the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_website_download.py
