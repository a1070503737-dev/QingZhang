name: Upload verified 1.3.7 release assets

on:
  push:
    branches: [codex/qingzhang-liquid-glass-ux]
    paths: [.github/workflows/publish-release-1.3.7.yml]

permissions:
  contents: write

concurrency:
  group: upload-release-1.3.7
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bacc93b962fb6c1bf6bda854069ef79325b9dbbb
          persist-credentials: false

      - name: Verify and upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/renovation-ledger-1.3.7-signed.apk dist/v1.3.7/renovation-ledger-1.3.7-signed.apk
          cd dist/v1.3.7
          sha256sum --check SHA256SUMS-1.3.7.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          apk = Path('renovation-ledger-1.3.7-signed.apk')
          expected_apk = '9522b683a5c74ce83a5e9a60783987dce5296a6b6014b19d46ab6c2b0e4e87a6'
          expected_manifest = '52ce696435520757b5b162a4d2ea24829b63d81b78a570bf129e780af57ffe0a'

          def digest(file):
              return hashlib.sha256(file.read_bytes()).hexdigest()

          update = Path('update.json')
          if digest(apk) != expected_apk or digest(update) != expected_manifest:
              raise SystemExit('Release file checksum mismatch')
          manifest = json.loads(update.read_text())
          expected_metadata = (1, 'com.zhuangxiu.ledger', '1.3.7', 22)
          if tuple(manifest[key] for key in ('schemaVersion', 'packageName', 'versionName', 'versionCode')) != expected_metadata:
              raise SystemExit('Unexpected update metadata')
          if manifest['apk'] != {'fileName': str(apk), 'size': apk.stat().st_size, 'sha256': expected_apk}:
              raise SystemExit('Update manifest does not match the signed APK')

          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/450858909']))
          if release['tag_name'] != 'v1.3.7' or release['target_commitish'] != 'bacc93b962fb6c1bf6bda854069ef79325b9dbbb':
              raise SystemExit('Unexpected release tag or source commit')
          existing = {asset['name']: asset for asset in release['assets']}
          for file in (apk, update, Path('SHA256SUMS-1.3.7.txt')):
              asset = existing.get(file.name)
              if asset:
                  if asset['state'] != 'uploaded' or asset.get('digest') != 'sha256:' + digest(file) or asset['size'] != file.stat().st_size:
                      raise SystemExit(f'Existing asset does not match: {file.name}')
                  print(f'Already verified: {file.name}', flush=True)
                  continue
              if not release['draft']:
                  raise SystemExit('Expected a draft release')
              subprocess.run(['gh', 'release', 'upload', 'v1.3.7', str(file), '--repo', repo], check=True)
          PY
