name: Upload verified 1.3.0 release assets

on:
  push:
    branches: [codex/qingzhang-import]
    paths: [.github/workflows/publish-release-1.3.0.yml]

permissions:
  contents: write

concurrency:
  group: upload-release-1.3.0
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c47d01ff361cbfc903b954eab2d242cfcade6da6
          persist-credentials: false

      - name: Verify and upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/renovation-ledger-1.3.0-signed.apk dist/v1.3.0/renovation-ledger-1.3.0-signed.apk
          cd dist/v1.3.0
          sha256sum --check SHA256SUMS-1.3.0.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          apk = Path('renovation-ledger-1.3.0-signed.apk')
          expected_apk = 'bd9db28517a21ce703a27e0d930b5d8a0c5d4bb591e29abdebfe7bc8eca424f1'
          expected_manifest = 'd57a7fc3a2f2c30a3b4f0c6882a38fba4a175223c22be965c64ec3debb8d6b9f'

          def digest(file):
              return hashlib.sha256(file.read_bytes()).hexdigest()

          update = Path('update.json')
          if digest(apk) != expected_apk or digest(update) != expected_manifest:
              raise SystemExit('Release file checksum mismatch')
          manifest = json.loads(update.read_text())
          expected_metadata = (1, 'com.zhuangxiu.ledger', '1.3.0', 15)
          if tuple(manifest[key] for key in ('schemaVersion', 'packageName', 'versionName', 'versionCode')) != expected_metadata:
              raise SystemExit('Unexpected update metadata')
          if manifest['apk'] != {'fileName': str(apk), 'size': apk.stat().st_size, 'sha256': expected_apk}:
              raise SystemExit('Update manifest does not match the signed APK')

          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/449599567']))
          if release['tag_name'] != 'v1.3.0' or release['target_commitish'] != 'c47d01ff361cbfc903b954eab2d242cfcade6da6':
              raise SystemExit('Unexpected release tag or source commit')
          existing = {asset['name']: asset for asset in release['assets']}
          for file in (apk, update, Path('SHA256SUMS-1.3.0.txt')):
              asset = existing.get(file.name)
              if asset:
                  if asset['state'] != 'uploaded' or asset.get('digest') != 'sha256:' + digest(file) or asset['size'] != file.stat().st_size:
                      raise SystemExit(f'Existing asset does not match: {file.name}')
                  print(f'Already verified: {file.name}', flush=True)
                  continue
              if not release['draft']:
                  raise SystemExit('Expected a draft release')
              subprocess.run(['gh', 'release', 'upload', 'v1.3.0', str(file), '--repo', repo], check=True)
          PY
