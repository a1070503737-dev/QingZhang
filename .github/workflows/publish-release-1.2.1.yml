name: Upload verified 1.2.1 release assets

on:
  push:
    branches: [codex/qingzhang-import]
    paths: [.github/workflows/publish-release-1.2.1.yml]

permissions:
  contents: write

concurrency:
  group: upload-release-1.2.1
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d4f777a91e63c1554bf536e57b208c82deba158a
          persist-credentials: false

      - name: Verify and upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/qingzhang-1.2.1-signed-test.apk dist/v1.2.1/renovation-ledger-1.2.1-signed.apk
          cd dist/v1.2.1
          sha256sum --check SHA256SUMS-1.2.1.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          apk = Path('renovation-ledger-1.2.1-signed.apk')
          expected_apk = '31d8e38078ba5d8f4ef5af7e225ea32ff862dea723bbb41b62d888e24aef053a'
          expected_manifest = 'f5c041d0640afdfa594c5f731e8f1eb43cf230be247212e6e0fe5daca1ae48f9'

          def digest(file):
              return hashlib.sha256(file.read_bytes()).hexdigest()

          update = Path('update.json')
          if digest(apk) != expected_apk or digest(update) != expected_manifest:
              raise SystemExit('Release file checksum mismatch')
          manifest = json.loads(update.read_text())
          expected_metadata = (1, 'com.zhuangxiu.ledger', '1.2.1', 13)
          if tuple(manifest[key] for key in ('schemaVersion', 'packageName', 'versionName', 'versionCode')) != expected_metadata:
              raise SystemExit('Unexpected update metadata')
          if manifest['apk'] != {'fileName': str(apk), 'size': apk.stat().st_size, 'sha256': expected_apk}:
              raise SystemExit('Update manifest does not match the signed APK')

          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/449422462']))
          if release['tag_name'] != 'v1.2.1' or release['target_commitish'] != 'd4f777a91e63c1554bf536e57b208c82deba158a':
              raise SystemExit('Unexpected release tag or source commit')
          existing = {asset['name']: asset for asset in release['assets']}
          for file in (apk, update, Path('SHA256SUMS-1.2.1.txt')):
              asset = existing.get(file.name)
              if asset:
                  if asset['state'] != 'uploaded' or asset.get('digest') != 'sha256:' + digest(file) or asset['size'] != file.stat().st_size:
                      raise SystemExit(f'Existing asset does not match: {file.name}')
                  print(f'Already verified: {file.name}', flush=True)
                  continue
              if not release['draft']:
                  raise SystemExit('Expected a draft release')
              subprocess.run(['gh', 'release', 'upload', 'v1.2.1', str(file), '--repo', repo], check=True)
          PY
