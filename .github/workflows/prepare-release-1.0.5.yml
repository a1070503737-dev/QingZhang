name: Prepare signed 1.0.5 candidate

on:
  push:
    branches: [codex/ledger-ui-refresh]
    paths:
      - .github/workflows/prepare-release-1.0.5.yml
      - app/**
      - gradle/**
      - gradlew
      - gradle.properties
      - settings.gradle.kts
      - build.gradle.kts
      - tools/verify_update.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 37 SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "Missing Android sdkmanager" >&2; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and unsigned release build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and verify ONLY with the original release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RENOVATION_LEDGER_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.RENOVATION_LEDGER_STORE_PASSWORD }}
          KEYPASS: ${{ secrets.RENOVATION_LEDGER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STOREPASS" ] || [ -z "$KEYPASS" ]; then
            echo "::warning::Signing credentials unavailable. No installable 1.0.5 release APK was created."
            echo "### 1.0.5 candidate" >> "$GITHUB_STEP_SUMMARY"
            echo "Tests and unsigned build completed, but no signed release APK was created." >> "$GITHUB_STEP_SUMMARY"
            echo "Configure the three RENOVATION_LEDGER_* repository Actions secrets using the ORIGINAL 1.0.4 keystore, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          umask 077
          KS="$RUNNER_TEMP/renovation-ledger-release.keystore"
          ALIGNED="$RUNNER_TEMP/app-release-aligned.apk"
          trap 'rm -f "$KS" "$ALIGNED"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"

          BT="$ANDROID_HOME/build-tools/37.0.0"
          OUTPUT="$RUNNER_TEMP/release-1.0.5"
          mkdir -p "$OUTPUT"
          "$BT/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$ALIGNED"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias renovation-ledger \
            --ks-pass env:STOREPASS --key-pass env:KEYPASS \
            --out "$OUTPUT/renovation-ledger-1.0.5-signed.apk" "$ALIGNED"

          "$BT/apksigner" verify --print-certs "$OUTPUT/renovation-ledger-1.0.5-signed.apk"
          "$BT/zipalign" -c -P 16 -v 4 "$OUTPUT/renovation-ledger-1.0.5-signed.apk"
          PATH="$BT:$PATH" python3 tools/verify_update.py \
            dist/renovation-ledger-1.0.4-signed.apk "$OUTPUT/renovation-ledger-1.0.5-signed.apk"
          "$BT/aapt" dump badging "$OUTPUT/renovation-ledger-1.0.5-signed.apk" | \
            grep -E "package: name='com.zhuangxiu.ledger' versionCode='6' versionName='1.0.5'"

          (cd "$OUTPUT" && sha256sum renovation-ledger-1.0.5-signed.apk > SHA256SUMS-1.0.5.txt)
          cp -a "$OUTPUT"/. release-candidate/
          echo "SIGNED_APK_READY=true" >> "$GITHUB_ENV"
          echo "### Signed 1.0.5 candidate verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Same package/signature as 1.0.4, versionCode 5 → 6. **Not published.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed 1.0.5 candidate (not a GitHub Release)
        if: env.SIGNED_APK_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: renovation-ledger-1.0.5-signed-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 14
