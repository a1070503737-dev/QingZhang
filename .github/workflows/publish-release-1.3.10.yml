name: Upload verified 1.3.10 release assets

on:
  push:
    branches: [codex/qingzhang-material-ui]
    paths: [.github/workflows/publish-release-1.3.10.yml]

permissions:
  contents: write

concurrency:
  group: upload-release-1.3.10
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify and upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/renovation-ledger-1.3.10-signed.apk dist/v1.3.10/renovation-ledger-1.3.10-signed.apk
          cd dist/v1.3.10
          sha256sum --check SHA256SUMS-1.3.10.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          apk = Path('renovation-ledger-1.3.10-signed.apk')
          expected_apk = 'b6951a541961eecf8016536abcdb50c0eabbbe1afbc379fcdf216d9fa1b30bd4'
          expected_manifest = 'c3a35bad9bba9c7ec53215022de0c14668c73e43195a0da06eefe0f3cf6ab4f9'

          def digest(file):
              return hashlib.sha256(file.read_bytes()).hexdigest()

          update = Path('update.json')
          if digest(apk) != expected_apk or digest(update) != expected_manifest:
              raise SystemExit('Release file checksum mismatch')
          manifest = json.loads(update.read_text())
          expected_metadata = (1, 'com.zhuangxiu.ledger', '1.3.10', 25)
          if tuple(manifest[key] for key in ('schemaVersion', 'packageName', 'versionName', 'versionCode')) != expected_metadata:
              raise SystemExit('Unexpected update metadata')
          if manifest['apk'] != {'fileName': str(apk), 'size': apk.stat().st_size, 'sha256': expected_apk}:
              raise SystemExit('Update manifest does not match the signed APK')

          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/451460122']))
          if release['tag_name'] != 'v1.3.10' or release['target_commitish'] != '834b0a83c6b93ef3b4759d0428fadc0d96abaf74':
              raise SystemExit('Unexpected release tag or source commit')
          existing = {asset['name']: asset for asset in release['assets']}
          for file in (apk, update, Path('SHA256SUMS-1.3.10.txt')):
              asset = existing.get(file.name)
              if asset:
                  if asset['state'] != 'uploaded' or asset.get('digest') != 'sha256:' + digest(file) or asset['size'] != file.stat().st_size:
                      raise SystemExit(f'Existing asset does not match: {file.name}')
                  print(f'Already verified: {file.name}', flush=True)
                  continue
              if not release['draft']:
                  raise SystemExit('Expected a draft release')
              subprocess.run(['gh', 'release', 'upload', 'v1.3.10', str(file), '--repo', repo], check=True)
          PY
