name: Publish 1.0.5 debug test APK

on:
  push:
    branches: [codex/ledger-ui-refresh]
    paths: [.github/workflows/publish-debug-1.0.5.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify already tested 1.0.5 debug build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_RUN=44025435709
          SOURCE_SHA=9d9dd402bf1810e62ae497bf234599363354a284
          ACTUAL_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "Unexpected build source commit" >&2
            exit 1
          fi
          mkdir -p candidate
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name renovation-ledger-debug-apk --dir candidate
          test -s candidate/app-debug.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BT/apksigner"
          test -x "$BT/aapt"
          "$BT/apksigner" verify --print-certs candidate/app-debug.apk
          "$BT/aapt" dump badging candidate/app-debug.apk | grep -E "package: name='com.zhuangxiu.ledger' versionCode='6' versionName='1.0.5'"
          (cd candidate && sha256sum app-debug.apk > SHA256SUMS-1.0.5-debug.txt)
          mv candidate/app-debug.apk candidate/renovation-ledger-1.0.5-debug.apk

      - name: Publish as prerelease, never latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > candidate/RELEASE-NOTES.md <<'EOF'
          # 装修记账 1.0.5 调试测试版

          此版本来自已经通过 GitHub Actions 编译和单元测试的 1.0.5 Debug APK，包含公开 GitHub 仓库免 Token 检查更新改动。**这不是正式签名发行版，亦不会设为 Latest**。

          **安装注意：此 APK 使用 Android 调试签名，不能直接覆盖 1.0.3/1.0.4 正式签名安装包。不要直接卸载含有装修账本及照片的原 App。** 若需要单独安装测试，请先在旧版导出账本+凭证备份，并确认可恢复及备份文件位于应用外部。完全未签名的 APK 无法由 Android 正常安装。

          正式 1.0.4 Release 不变。若将来希望保留原 App 数据原地升级，仍必须找回 1.0.4 原签名密钥。
          EOF
          if gh release view v1.0.5-debug --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Test prerelease already exists; refusing to overwrite."
            exit 0
          fi
          gh release create v1.0.5-debug \
            candidate/renovation-ledger-1.0.5-debug.apk \
            candidate/SHA256SUMS-1.0.5-debug.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 9d9dd402bf1810e62ae497bf234599363354a284 \
            --title "装修记账 1.0.5 Debug 测试版（不兼容覆盖安装）" \
            --notes-file candidate/RELEASE-NOTES.md \
            --prerelease --latest=false
