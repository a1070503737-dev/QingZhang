name: Remove old v1.0.5-debug prerelease

on:
  push:
    branches: [codex/ledger-ui-refresh]
    paths:
      - .github/workflows/remove-v1.0.5-debug.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only confirmed v1.0.5-debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ID=448210481
          TARGET_TAG=v1.0.5-debug
          RESOURCE="repos/$GITHUB_REPOSITORY/releases/$TARGET_ID"
          if ! gh api "$RESOURCE" > "$RUNNER_TEMP/target-release.json" 2>/dev/null; then
            echo "Release not found; already deleted."
            exit 0
          fi
          jq -e --arg tag "$TARGET_TAG" --argjson id "$TARGET_ID" \
            '.id == $id and .tag_name == $tag and .prerelease == true and .draft == false' \
            "$RUNNER_TEMP/target-release.json" >/dev/null || {
              echo "Release is not the expected prerelease; refusing deletion." >&2
              exit 1
            }
          gh api --method DELETE "$RESOURCE"
          echo "Deleted v1.0.5-debug prerelease (release ID $TARGET_ID)."
          echo "The Git tag and v1.0.4 stable release are untouched."
