name: Upload verified 1.3.2 release assets

on:
  push:
    branches: [codex/qingzhang-import]
    paths: [.github/workflows/publish-release-1.3.2.yml]

permissions:
  contents: write

concurrency:
  group: upload-release-1.3.2
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b2c1da3663439756842890e0d20a8fbeb60641b8
          persist-credentials: false

      - name: Verify and upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/renovation-ledger-1.3.2-signed.apk dist/v1.3.2/renovation-ledger-1.3.2-signed.apk
          cd dist/v1.3.2
          sha256sum --check SHA256SUMS-1.3.2.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          apk = Path('renovation-ledger-1.3.2-signed.apk')
          expected_apk = 'd72cd06286d840cd6e51577b51acbf38374a5222478221af890492c60ac96fd0'
          expected_manifest = 'f842f03366e59100b4340aa1b696cce233fbc210cfac1c2cccdb7f3bd3132a88'

          def digest(file):
              return hashlib.sha256(file.read_bytes()).hexdigest()

          update = Path('update.json')
          if digest(apk) != expected_apk or digest(update) != expected_manifest:
              raise SystemExit('Release file checksum mismatch')
          manifest = json.loads(update.read_text())
          expected_metadata = (1, 'com.zhuangxiu.ledger', '1.3.2', 17)
          if tuple(manifest[key] for key in ('schemaVersion', 'packageName', 'versionName', 'versionCode')) != expected_metadata:
              raise SystemExit('Unexpected update metadata')
          if manifest['apk'] != {'fileName': str(apk), 'size': apk.stat().st_size, 'sha256': expected_apk}:
              raise SystemExit('Update manifest does not match the signed APK')

          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/449707329']))
          if release['tag_name'] != 'v1.3.2' or release['target_commitish'] != 'b2c1da3663439756842890e0d20a8fbeb60641b8':
              raise SystemExit('Unexpected release tag or source commit')
          existing = {asset['name']: asset for asset in release['assets']}
          for file in (apk, update, Path('SHA256SUMS-1.3.2.txt')):
              asset = existing.get(file.name)
              if asset:
                  if asset['state'] != 'uploaded' or asset.get('digest') != 'sha256:' + digest(file) or asset['size'] != file.stat().st_size:
                      raise SystemExit(f'Existing asset does not match: {file.name}')
                  print(f'Already verified: {file.name}', flush=True)
                  continue
              if not release['draft']:
                  raise SystemExit('Expected a draft release')
              subprocess.run(['gh', 'release', 'upload', 'v1.3.2', str(file), '--repo', repo], check=True)
          PY
